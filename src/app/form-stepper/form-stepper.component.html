<ol class="stepper-progress" aria-label="Form progress">
  @for (label of labels; track label; let i = $index) {
    <li [class.done]="i < step" [class.current]="i === step" [attr.aria-current]="i === step ? 'step' : null">
      <button type="button" [disabled]="i >= step || saving" [attr.aria-label]="'Go to ' + label" (click)="goTo(i)">
        <span class="stepper-dot">{{ i < step ? '✓' : i + 1 }}</span>
        <span class="stepper-label">{{ label }}</span>
      </button>
    </li>
  }
</ol>

<div class="stepper-body">
  <ng-content></ng-content>
</div>

<footer class="stepper-actions">
  @if (!firstStepBackEnabled) {
    <button type="button" class="control-button" [disabled]="saving" (click)="cancel.emit()">
      <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      Cancel
    </button>
  } @else if (isFirst) {
    <button type="button" class="control-button" [disabled]="saving" (click)="firstStepBack.emit()">
      <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      Back
    </button>
  }
  <span class="stepper-spacer"></span>
  @if (!isFirst) {
    <button type="button" class="control-button" [disabled]="saving" (click)="back()">
      <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      Back
    </button>
  }
  @if (isLast) {
    <button type="submit" class="control-button" [ngClass]="submitClass" [disabled]="submitDisabled">
      <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      {{ submitLabel }}
    </button>
  } @else {
    <button type="button" class="control-button primary-action" [disabled]="nextDisabled" (click)="next()">
      Next
      <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  }
</footer>
