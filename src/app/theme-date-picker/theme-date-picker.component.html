<div class="date-picker" [class.open]="isOpen">
  <button
    type="button"
    class="date-picker-trigger"
    cdkOverlayOrigin
    #pickerOrigin="cdkOverlayOrigin"
    aria-haspopup="dialog"
    [attr.aria-expanded]="isOpen"
    [attr.aria-label]="ariaLabel"
    [disabled]="isDisabled"
    (click)="toggle()">
    <span [class.placeholder]="!displayValue">{{ displayValue || (mode === 'month' ? 'Select month' : 'Select date') }}</span>
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="2"></rect>
      <path d="M16 2v4M8 2v4M3 10h18"></path>
    </svg>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="pickerOrigin"
    [cdkConnectedOverlayOpen]="isOpen"
    [cdkConnectedOverlayPositions]="popupPositions"
    [cdkConnectedOverlayViewportMargin]="12"
    [cdkConnectedOverlayPush]="true"
    (overlayOutsideClick)="onDocumentClick($event)"
    (overlayKeydown)="$event.key === 'Escape' && close()">
    <div class="date-picker-popup" role="dialog" [attr.aria-label]="ariaLabel">
      <div class="date-picker-header">
        <button type="button" class="date-picker-nav" aria-label="Previous" [disabled]="!canShift(-1)" (click)="shift(-1)">‹</button>
        <button type="button" class="date-picker-title" aria-label="Choose year" title="Choose year" [attr.aria-expanded]="isChoosingYear" (click)="toggleYearChooser()">
          {{ title }}
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <button type="button" class="date-picker-nav" aria-label="Next" [disabled]="!canShift(1)" (click)="shift(1)">›</button>
      </div>

      @if (isChoosingYear) {
        <div class="date-picker-months" aria-label="Years">
          @for (year of years; track year) {
            <button type="button" class="date-picker-cell" [class.selected]="year === viewYear" [disabled]="!isYearAllowed(year)" (click)="selectYear(year)">{{ year }}</button>
          }
        </div>
      } @else if (mode === 'month') {
        <div class="date-picker-months">
          @for (name of months; track name; let i = $index) {
            <button
              type="button"
              class="date-picker-cell"
              [class.selected]="isSelectedMonth(i)"
              [disabled]="!isAllowed(monthValue(i))"
              (click)="selectMonth(i)">
              {{ name }}
            </button>
          }
        </div>
      } @else {
        <div class="date-picker-weekdays">
          @for (weekday of weekdays; track weekday) {
            <span>{{ weekday }}</span>
          }
        </div>
        <div class="date-picker-days">
          @for (day of days; track day.value) {
            <button
              type="button"
              class="date-picker-cell"
              [class.outside]="!day.inMonth"
              [class.today]="day.isToday"
              [class.selected]="isSelectedDay(day)"
              [disabled]="!isAllowed(day.value)"
              (click)="selectDay(day)">
              {{ day.day }}
            </button>
          }
        </div>
      }

      <div class="date-picker-footer">
        @if (allowClear) {
          <button type="button" class="date-picker-link" (click)="clear()">Clear</button>
        }
        <button type="button" class="date-picker-link" [disabled]="!isAllowed(todayValue)" (click)="selectToday()">{{ mode === 'month' ? 'This month' : 'Today' }}</button>
      </div>
    </div>
  </ng-template>
</div>
