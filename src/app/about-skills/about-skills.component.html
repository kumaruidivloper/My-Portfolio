<div class="row">
  <div class="progress">
    @for (skill of skills.slice(0, columnSplit); track $index) {
      <h3>{{skill.name}} <span class="percentage">
        <app-counter [stopRange]="[skill.level]" [durationMs]="animationDuration(transition[$index])" [active]="isBarInViewport($index)" [observeViewport]="false" (valueChange)="barValues[$index] = $event"></app-counter>%
      </span></h3>
      <div #barElement class="bar"><span [style.transition]="'width ' + stepMs($index) + 'ms linear'" [style.width]="barRange(barValues[$index] ?? 0)"></span></div>
    }
  </div>
  <div class="progress">
    @for (skill of skills.slice(columnSplit); track $index) {
      @let skillIndex = $index + columnSplit;
      <h3>{{skill.name}} <span class="percentage">
        <app-counter [stopRange]="[skill.level]" [durationMs]="animationDuration(transition[skillIndex])" [active]="isBarInViewport(skillIndex)" [observeViewport]="false" (valueChange)="barValues[skillIndex] = $event"></app-counter>%
      </span></h3>
      <div #barElement class="bar"><span [style.transition]="'width ' + stepMs(skillIndex) + 'ms linear'" [style.width]="barRange(barValues[skillIndex] ?? 0)"></span></div>
    }
  </div>
</div>
