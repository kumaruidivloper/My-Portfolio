<div class="row">
  <div class="progress">
    @for (skill of technology?.technology?.slice(0, 6); track $index) {
      <h3>{{skill}} <span class="percentage">
        <app-counter [stopRange]="[technology.level[$index]]" [durationMs]="animationDuration(transition[$index])" [active]="isBarInViewport($index)" [observeViewport]="false" (valueChange)="barValues[$index] = $event"></app-counter>%
      </span></h3>
      <div #barElement class="bar"><span [style.transition]="'width ' + stepMs($index) + 'ms linear'" [style.width]="barRange(barValues[$index] ?? 0)"></span></div>
    }
  </div>
  <div class="progress">
    @for (skill of technology?.technology?.slice(6, 12); track $index) {
      @let skillIndex = $index + 6;
      <h3>{{skill}} <span class="percentage">
        <app-counter [stopRange]="[technology.level[skillIndex]]" [durationMs]="animationDuration(transition[skillIndex])" [active]="isBarInViewport(skillIndex)" [observeViewport]="false" (valueChange)="barValues[skillIndex] = $event"></app-counter>%
      </span></h3>
      <div #barElement class="bar"><span [style.transition]="'width ' + stepMs(skillIndex) + 'ms linear'" [style.width]="barRange(barValues[skillIndex] ?? 0)"></span></div>
    }
  </div>
</div>
