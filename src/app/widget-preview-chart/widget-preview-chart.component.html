@if (loading && !latest) {
  <div class="preview-skeleton" role="status" aria-label="Loading chart preview"></div>
} @else if (latest) {
  <figure
    class="preview"
    [attr.role]="hasViews ? null : 'img'"
    [attr.aria-label]="summary"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
    (click)="onClickCapture($event)">
    <figcaption class="preview-meta" [attr.aria-hidden]="hasViews ? null : 'true'">
      @if (hasViews) {
        <span class="preview-switcher" role="group" aria-label="Preview view" (keydown)="onSwitcherKeydown($event)">
          <button
            type="button"
            class="preview-arrow"
            [attr.aria-label]="'Previous view: ' + adjacentView(-1).label"
            (click)="stepView(-1, $event)">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"></path></svg>
          </button>
          <span class="preview-label" aria-live="polite">{{ currentViewLabel }}</span>
          <button
            type="button"
            class="preview-arrow"
            [attr.aria-label]="'Next view: ' + adjacentView(1).label"
            (click)="stepView(1, $event)">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg>
          </button>
        </span>
      } @else {
        <span class="preview-label">{{ label }}</span>
      }
      <span class="preview-value">{{ formatValue(latest.value) }}</span>
      @if (change !== null) {
        <span class="preview-change" [class.down]="change < 0" [class.flat]="change === 0">
          {{ change > 0 ? '▲' : change < 0 ? '▼' : '' }} {{ (change < 0 ? -change : change) | number: '1.0-1' }}%
        </span>
      }
    </figcaption>
    @if (linePath) {
      <div class="preview-plot">
      <svg class="preview-chart" [attr.viewBox]="'0 0 ' + width + ' ' + height" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient [attr.id]="gradientId" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="currentColor" stop-opacity="0.32"></stop>
            <stop offset="100%" stop-color="currentColor" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <g class="preview-grid">
          @for (y of gridRows; track $index) {
            <line [attr.x1]="0" [attr.x2]="width" [attr.y1]="y" [attr.y2]="y"></line>
          }
          @for (x of gridColumns; track $index) {
            <line [attr.x1]="x" [attr.x2]="x" [attr.y1]="0" [attr.y2]="height"></line>
          }
        </g>
        <path class="preview-area" [attr.d]="areaPath" [attr.fill]="'url(#' + gradientId + ')'"></path>
        <path class="preview-line" [attr.d]="linePath"></path>
      </svg>
      @if (lastPoint) {
        <span
          class="preview-dot"
          aria-hidden="true"
          [style.left.%]="(lastPoint.x / width) * 100"
          [style.top.%]="(lastPoint.y / height) * 100"></span>
      }
      </div>
    }
    <div class="preview-range" aria-hidden="true">
      <span>{{ first?.name }}</span>
      <span>{{ latest.name }}</span>
    </div>
  </figure>
}
