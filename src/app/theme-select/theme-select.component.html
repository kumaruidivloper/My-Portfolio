<div class="theme-select" [class.open]="isOpen">
  <button
    type="button"
    class="theme-select-trigger"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen"
    [attr.aria-label]="ariaLabel"
    (click)="toggle()"
    (keydown)="onKeydown($event)">
    <span>{{ selectedLabel }}</span>
    <i class="theme-select-arrow" aria-hidden="true"></i>
  </button>
  @if (isOpen) {
    <ul class="theme-select-list" role="listbox" [attr.aria-label]="ariaLabel">
      @for (option of options; track option.value; let i = $index) {
        <li
          role="option"
          class="theme-select-option"
          [class.selected]="option.value === value"
          [class.active]="i === activeIndex"
          [attr.aria-selected]="option.value === value"
          (mouseenter)="activeIndex = i"
          (click)="select(option)">
          {{ option.label }}
        </li>
      }
    </ul>
  }
</div>
