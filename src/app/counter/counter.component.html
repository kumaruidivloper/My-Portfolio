@for (counter of counters; track counter) {
  <div class="counter-element" [attr.aria-label]="counter.value">
    @for (digit of formatCounter(counter.value); track $index; let digitIndex = $index) {
      <span
        class="digit-window"
        [class.flip-a]="counter.hasFlipped && counter.flip && digitChanged(counter.value, counter.previousValue ?? counter.value, digitIndex)"
        [class.flip-b]="counter.hasFlipped && !counter.flip && digitChanged(counter.value, counter.previousValue ?? counter.value, digitIndex)"
        aria-hidden="true">
        <span class="digit-half digit-upper">
          <span class="digit-face">{{ digit }}</span>
        </span>
        <span class="digit-half digit-lower">
          <span class="digit-face">{{ digit }}</span>
        </span>
        <span class="digit-flap">
          <span class="digit-flap-face flap-front">{{ previousDigit(counter.value, counter.previousValue ?? counter.value, digitIndex) }}</span>
          <span class="digit-flap-face flap-back">{{ digit }}</span>
        </span>
      </span>
    }
  </div>
}
