@for (counter of counters; track counter; let i = $index) {
  <div class="counter-element" [attr.aria-label]="counter.value" [style.--roll-ms]="stepMs(i) + 'ms'">
    @for (digit of formatCounter(counter.value); track $index; let digitIndex = $index) {
      <span class="digit-window">
        <span class="digit-strip" aria-hidden="true" [style.transform]="'translateZ(-2.077em) rotateX(' + wheelRotation(counter.value, digitIndex) + 'deg)'">
          @for (wheelDigit of digitWheel; track wheelDigit) {
            <span class="digit-tile" [style.transform]="'rotateX(-' + wheelDigit * 36 + 'deg) translateZ(2.077em)'">{{ wheelDigit }}</span>
          }
        </span>
      </span>
    }
  </div>
}
